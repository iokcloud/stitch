[package]
name = "stitch"
version.workspace = true
edition.workspace = true
description = "PromptStdio Agent CLI — stitch prompts into workflows"

[lib]
name = "stitch"
path = "src/lib.rs"

[[bin]]
name = "stitch"
path = "src/main.rs"

[features]
default = []
tui = ["dep:ratatui", "dep:tui-textarea"]

[dependencies]
# Workspace shared
promptstdio-core = { path = "../promptstdio-core", default-features = false }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }

# Terminal rendering
crossterm = "0.28"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# Interactive prompts
dialoguer = "0.11"
rustyline = "15"
ctrlc = "3.4"

# SSE streaming
eventsource-stream = "0.2"

# Configuration
toml = "0.8"
directories = "5"
chrono = { workspace = true }

# Windows console (cmd) often emits GBK/ACP bytes, not UTF-8
encoding_rs = "0.8"

# Reasoning-block stripping (Qwen3 / DeepSeek-R1 / Claude thinking)
regex = "1"

# WebSocket for Chrome DevTools Protocol
tokio-tungstenite = { version = "0.24", features = ["connect"] }

# Standard MCP protocol client (stdio + Streamable HTTP)
rmcp = { version = "2.2.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
http = "1"

# Optional TUI mode
ratatui = { version = "0.29", optional = true }
tui-textarea = { version = "0.7", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Graphics_Imaging",
    "Media_Ocr",
    "Globalization",
    "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
