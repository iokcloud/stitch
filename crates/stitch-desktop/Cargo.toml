[package]
name = "stitch-desktop"
version.workspace = true
edition.workspace = true
description = "PromptStdio Agent Desktop Client — Tauri-based GUI for stitch"

[build-dependencies]
# features = [] is OK here (config-json5 / config-toml only). Not related to custom-protocol.
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol lives on the *runtime* crate via [features] below — keep default on.
# Without it, `cargo build` may hit Vite/localhost → "连接被拒绝".
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "net", "io-util", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
stitch = { path = "../stitch" }
urlencoding = { workspace = true }
uuid = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
# Optional: enable with `--features webdriver` for WDIO desktop smoke only.
tauri-plugin-wdio-webdriver = { version = "1.1", optional = true }
rfd = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Embedded WebDriver for WDIO desktop smoke (`scripts/smoke-desktop.sh`).
webdriver = ["dep:tauri-plugin-wdio-webdriver"]
