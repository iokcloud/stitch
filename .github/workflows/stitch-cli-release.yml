name: stitch-cli-release

# Stitch CLI 单二进制发布（种子验证通道 · docs/LONG-HORIZON-CONTEXT-PLAN.md）
# 四产物：Windows x64 / macOS Intel / macOS Apple Silicon / Linux musl（静态）
# 触发：仅手动（curl API workflow_dispatch，与桌面 mac/linux 出包同先例）。
# 注意：v* tag 留给桌面 build.yml（tauri），CLI 不再用 tag 触发。
# 产物进 artifact，由发布脚本下载并传 draft Release。
on:
  workflow_dispatch:

jobs:
  build-cli:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "windows-latest"
            artifact: "stitch-x86_64-pc-windows-msvc.exe"
          - os: "macos-latest"
            target: "x86_64-apple-darwin"
            artifact: "stitch-x86_64-apple-darwin"
          - os: "macos-latest"
            target: "aarch64-apple-darwin"
            artifact: "stitch-aarch64-apple-darwin"
          - os: "ubuntu-22.04"
            target: "x86_64-unknown-linux-musl"
            artifact: "stitch-x86_64-unknown-linux-musl"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/stitch -> target"

      - name: install musl linker (linux only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: build cli
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p stitch --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/stitch ${{ matrix.artifact }}
          else
            cargo build --release -p stitch
            cp target/release/stitch.exe ${{ matrix.artifact }}
          fi
          chmod +x ${{ matrix.artifact }}

      - name: sha256 checksum
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: stitch-*
          if-no-files-found: error
