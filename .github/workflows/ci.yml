name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/stitch-desktop -> target"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/stitch-desktop/frontend/package-lock.json

      # Tauri Linux 系统依赖（webview2gtk 等）
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Frontend build
        working-directory: crates/stitch-desktop/frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Cargo fmt & clippy
        run: |
          cargo fmt --check
          cargo clippy --workspace -- -D warnings

      - name: Cargo test
        run: cargo test --workspace
