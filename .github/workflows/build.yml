name: build

# 三平台构建产物（参考 tauri-action 官方矩阵示例）
# 触发：手动 + 推送 v* tag。产物上传 artifact，供 Release 发布。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin --bundles dmg"
          - platform: "ubuntu-22.04"
            args: "--bundles deb,appimage"
          - platform: "windows-latest"
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/stitch-desktop/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/stitch-desktop -> target"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        working-directory: crates/stitch-desktop/frontend
        run: npm ci

      # beforeBuildCommand 在 CI 的 cwd 语义不可靠（Windows 无 sh / Linux 找不到脚本），
      # 这里显式构建 UI + touch build.rs 强制重嵌，再以 --config 覆盖 beforeBuildCommand 为空。
      - name: build frontend UI
        working-directory: crates/stitch-desktop
        run: bash scripts/build-ui.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 安装包签名密钥（用户在本机 ~/.stitch/updater.key；配置到仓库 secrets 后启用）
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/stitch-desktop
          # tag 触发（push v*）时自动建 draft Release 并传资产（发布动作，人工 publish）；
          # workflow_dispatch 时 tagName 为空 → 只构建不发布（资产进 artifact）。
          tagName: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && github.ref_type == 'tag' && format('Stitch {0}', github.ref_name) || '' }}
          releaseDraft: true
          releasePrerelease: false
          # CI 无 TAURI_SIGNING_PRIVATE_KEY（公钥已配置 → updater 签名产物会报错），
          # 关 updater 产物；Windows 发版时本机生成 .sig 上传并覆盖签名版。
          args: '${{ matrix.args }} --config {"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'

      # 手动触发（workflow_dispatch）时 tauri-action 不传 Release，显式保留产物供检查；
      # tag 触发时 tauri-action 会直接把资产传进 Release。
      # 产物在仓库根 target/（tauri-action 从 workspace 根跑 cargo）；
      # mac 交叉编译（--target <triple>）产物在 target/<triple>/release/bundle/。
      - name: upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: target/**/release/bundle/**
          if-no-files-found: error
