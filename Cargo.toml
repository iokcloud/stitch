[workspace]
resolver = "2"
members = [
    "crates/promptstdio-core",
    "crates/stitch",
    "crates/stitch-desktop",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["PromptStdio"]
description = "Stitch — open-source desktop AI agent"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "form"] }
axum-extra = { version = "0.9", features = ["cookie"] }
leptos = { version = "0.7", default-features = false }
leptos_meta = { version = "0.7" }
leptos_router = { version = "0.7", default-features = false }
leptos_axum = { version = "0.7" }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
wasm-bindgen = "0.2"
http = "1"
cfg-if = "1"
meilisearch-sdk = "0.28"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
argon2 = "0.5"
surrealdb = { version = "2", features = ["kv-mem", "kv-surrealkv", "protocol-ws"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "set-header", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
zip = "2"
object_store = { version = "0.12", features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonschema = { version = "0.29", default-features = false }
base64 = "0.22"
urlencoding = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
aes-gcm = "0.10"
rand = "0.8"
x509-parser = "0.16"

